name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validation/scripts/check_repository.py
      - run: python validation/scripts/calculate_costs.py --check
      - run: python validation/scripts/check_visitor_fixtures.py
      - run: python -m unittest discover -s validation/tests -v
      - run: python spikes/edge-replay/demo.py
