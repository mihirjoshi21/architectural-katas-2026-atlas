<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1985" viewBox="0 0 1600 1985" role="img" aria-labelledby="title desc"><title id="title">Admission and fenced authority recovery</title><desc id="desc">UML sequence</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1985" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D04-OFFLINE-ADMISSION  /  UML SEQUENCE</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Admission and fenced authority recovery</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="35.0" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="160.0" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Gate validator</text><polyline points="160.0,268 160.0,1680" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><rect x="461.66666666666674" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="586.6666666666667" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Authority / spare</text><polyline points="586.6666666666667,268 586.6666666666667,1680" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><rect x="888.3333333333334" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="1013.3333333333334" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Redemption journal</text><polyline points="1013.3333333333334,268 1013.3333333333334,1680" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><rect x="1315.0" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="1440.0" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Recovery operator</text><polyline points="1440.0,268 1440.0,1680" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><polyline points="160.0,330 230.0,330 230.0,365 160.0,365" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="345.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Verify signature and entitlement</text><polyline points="160.0,445 586.6666666666667,445" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="373.33333333333337" y="433.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Redeem: request ID, party, generation</text><polyline points="586.6666666666667,530 1013.3333333333334,530" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="800.0" y="518.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Atomic allowance check and journal append</text><polyline points="1013.3333333333334,610 586.6666666666667,610" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="800.0" y="598.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Committed or previous decision</text><polyline points="586.6666666666667,685 160.0,685" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="373.33333333333337" y="673.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Decision with matching generation</text><polyline points="1440.0,930 586.6666666666667,930" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1013.3333333333334" y="918.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Physically fence former writer; stop automatic service</text><polyline points="1440.0,1020 1013.3333333333334,1020" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1226.6666666666667" y="1008.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Restore and reconcile acknowledged redemptions</text><polyline points="1013.3333333333334,1100 1440.0,1100" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1226.6666666666667" y="1088.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Completeness established or recovery blocked</text><polyline points="1440.0,1200 586.6666666666667,1200" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1013.3333333333334" y="1188.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Configure spare with next generation</text><polyline points="1440.0,1300 160.0,1300" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="800.0" y="1288.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Authenticate and persist new generation / authority</text><polyline points="160.0,1400 586.6666666666667,1400" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="373.33333333333337" y="1388.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Redeem only after enrollment and allowlisting</text><polyline points="586.6666666666667,1475 160.0,1475" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="373.33333333333337" y="1463.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Matching generation decision</text><rect x="65" y="780" width="1470" height="90" rx="0" fill="#FFF8DE" stroke="#91651F" stroke-width="2"/><text x="800.0" y="818.61" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">RECOVERY BRANCH — operations lead authorizes; operator executes the checklist.</text><text x="800.0" y="842.91" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">No automatic promotion. Journal completeness and fencing are prerequisites.</text><rect x="65" y="1570" width="1470" height="100" rx="0" fill="#FFF8DE" stroke="#91651F" stroke-width="2"/><text x="800.0" y="1613.61" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Unverified fence, incomplete journal or unupdated validator: no automatic redemption.</text><text x="800.0" y="1637.9099999999999" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Use the designated staffed exception desk; synchronize with cloud after WAN recovery.</text><polyline points="55,1832 1545,1832" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1866.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1904.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Top boxes: participants. Vertical dashed lines: lifelines. Solid arrows: requests or actions. Dashed horizontal arrows: responses. An X marks a</text><text x="55" y="1929.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">lost message.</text></g></svg>
