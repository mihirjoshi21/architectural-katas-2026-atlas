ont-size="20" font-weight="400" fill="#172B3A">Example question:</text><text x="800.0" y="411.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Accessible activities this</text><text x="800.0" y="438.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">afternoon?</text><rect x="610" y="505" width="380" height="230" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="800.0" y="585.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Approved options</text><text x="800.0" y="612.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Source and last-update time</text><text x="800.0" y="639.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Live status clearly distinguished</text><text x="800.0" y="666.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">from static descriptions</text><rect x="610" y="805" width="380" height="90" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="800.0" y="843.255" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Live status unavailable?</text><text x="800.0" y="868.905" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Browse approved information</text><text x="610" y="955.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Optional saved return plan</text><text x="610" y="979.3" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Reminders need separate permission</text><text x="1135" y="315.0" text-anchor="start" font-size="25" font-weight="700" fill="#172B3A">Zone comparison</text><text x="1135" y="395.0" text-anchor="start" font-size="20" font-weight="400" fill="#172B3A">Zone A</text><rect x="1135" y="411" width="255" height="28" rx="0" fill="#A8C8DE" stroke="#A8C8DE" stroke-width="2"/><text x="1135" y="500.0" text-anchor="start" font-size="20" font-weight="400" fill="#172B3A">Zone B</text><rect x="1135" y="516" width="165" height="28" rx="0" fill="#A8C8DE" stroke="#A8C8DE" stroke-width="2"/><text x="1135" y="605.0" text-anchor="start" font-size="20" font-weight="400" fill="#172B3A">Zone C</text><rect x="1135" y="621" width="205" height="28" rx="0" fill="#A8C8DE" stroke="#A8C8DE" stroke-width="2"/><text x="1135" y="750.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">Illustrative bars, not measurements</text><text x="1135" y="772.95" text-anchor="start" font-size="17" font-weight="400" fill="#536878">Coverage and period shown together</text><rect x="1135" y="835" width="380" height="105" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="1325.0" y="880.0450000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Record staffing decision</text><text x="1325.0" y="908.3950000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Reason + follow-up date</text><text x="55" y="1105.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Wireframes specify content and states. The values and bars above are synthetic interface examples, not estate results.</text><polyline points="55,1212 1545,1212" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1246.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1284.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Outer frames: separate user views. Inner boxes: content or controls. Bars and values: synthetic examples. Warning text describes state; color</text><text x="55" y="1309.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">alone does not determine permission.</text></g></svg>
