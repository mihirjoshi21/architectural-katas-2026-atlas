<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1585" viewBox="0 0 1600 1585" role="img" aria-labelledby="title desc"><title id="title">Lost receipt: retry identity, never repeat the effect</title><desc id="desc">UML sequence</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1585" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D05-STORE-FORWARD  /  UML SEQUENCE</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Lost receipt: retry identity, never repeat the effect</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="35.0" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="160.0" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Source</text><polyline points="160.0,268 160.0,1280" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><rect x="461.66666666666674" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="586.6666666666667" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Edge outbox</text><polyline points="586.6666666666667,268 586.6666666666667,1280" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><rect x="888.3333333333334" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="1013.3333333333334" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Cloud ingestion</text><polyline points="1013.3333333333334,268 1013.3333333333334,1280" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><rect x="1315.0" y="190" width="250" height="78" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="1440.0" y="235.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Inbox + effect</text><polyline points="1440.0,268 1440.0,1280" fill="none" stroke="#9BACB7" stroke-width="2" stroke-dasharray="7 6"/><polyline points="160.0,335 586.6666666666667,335" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="373.33333333333337" y="323.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Stable event ID + payload hash</text><polyline points="586.6666666666667,410 656.6666666666667,410 656.6666666666667,445 586.6666666666667,445" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="756.6666666666667" y="425.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Commit before acceptance</text><polyline points="586.6666666666667,490 160.0,490" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="373.33333333333337" y="478.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Accepted locally</text><polyline points="586.6666666666667,590 1013.3333333333334,590" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="800.0" y="578.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Upload event ID + hash + payload</text><polyline points="1013.3333333333334,665 1440.0,665" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1226.6666666666667" y="653.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">One transaction: inbox + permitted effect</text><polyline points="1440.0,740 1013.3333333333334,740" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1226.6666666666667" y="728.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Committed</text><polyline points="1013.3333333333334,815 586.6666666666667,815" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6"/><text x="800.0" y="803.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Final receipt lost in transit</text><polyline points="577.6666666666667,806 595.6666666666667,824" fill="none" stroke="#A33F49" stroke-width="2"/><polyline points="577.6666666666667,824 595.6666666666667,806" fill="none" stroke="#A33F49" stroke-width="2"/><polyline points="586.6666666666667,915 1013.3333333333334,915" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="800.0" y="903.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Retry the same ID and content</text><polyline points="1013.3333333333334,995 1440.0,995" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1226.6666666666667" y="983.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Find existing inbox receipt; no second effect</text><polyline points="1013.3333333333334,1075 586.6666666666667,1075" fill="none" stroke="#536878" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="800.0" y="1063.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Return matching final receipt</text><rect x="60" y="1180" width="1480" height="100" rx="0" fill="#FFF8DE" stroke="#91651F" stroke-width="2"/><text x="800.0" y="1223.61" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Move from pending queue to a separate seven-day recovery archive.</text><text x="800.0" y="1247.9099999999999" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">A collection-unit custody receipt cannot acknowledge the cloud transaction.</text><polyline points="55,1432 1545,1432" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1466.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1504.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Top boxes: participants. Vertical dashed lines: lifelines. Solid arrows: requests or actions. Dashed horizontal arrows: responses. An X marks a</text><text x="55" y="1529.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">lost message.</text></g></svg>
