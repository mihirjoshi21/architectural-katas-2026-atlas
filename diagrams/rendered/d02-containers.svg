weight="700" fill="#172B3A">PostgreSQL</text><text x="860.0" y="797.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Module-owned schemas + audit</text><rect x="675" y="920" width="370" height="110" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="860.0" y="967.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Reporting worker</text><text x="860.0" y="996.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Popularity · return cohorts</text><rect x="1130" y="920" width="365" height="110" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="1312.5" y="954.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">AI adapter</text><text x="1312.5" y="981.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Scoped retrieval · read tools</text><text x="1312.5" y="1008.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Budget and output policy</text><rect x="80" y="1190" width="410" height="125" rx="0" fill="#EEF1F4" stroke="#536878" stroke-width="2"/><text x="285.0" y="1229.84" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Ticket / payment supplier</text><text x="285.0" y="1259.54" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Authorized issuance and</text><text x="285.0" y="1289.24" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">settlement</text><path d="M610,1210 C610,1183 1020,1183 1020,1210 L1020,1300 C1020,1327 610,1327 610,1300 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M610,1210 C610,1237 1020,1237 1020,1210" fill="none" stroke="#245A89" stroke-width="2"/><text x="815.0" y="1253.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Object storage</text><text x="815.0" y="1282.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Knowledge, evidence, model artifacts</text><rect x="1130" y="1190" width="365" height="125" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="1312.5" y="1244.69" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Model provider</text><text x="1312.5" y="1274.39" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">External inference API</text><polyline points="865,345 865,440" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="405.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">HTTPS APIs</text><polyline points="530,545 585,545 585,365 1515,365 1515,500 1495,500" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1300" y="345.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Authenticated batches / receipts</text><polyline points="865,605 865,705" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="745" y="665.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Transactions</text><polyline points="1310,565 1310,645 1005,645 1005,705" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1180" y="625.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Inbox + effect</text><polyline points="865,850 865,920" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="965" y="888.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Read models</text><polyline points="1045,480 1085,480 1085,970 1130,970" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1190" y="875.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">AI request</text><polyline points="1310,1030 1310,1190" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1410" y="1120.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Provider API</text><polyline points="865,1030 865,1190" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="940" y="1120.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Exports</text><polyline points="675,560 585,560 585,1150 285,1150 285,1190" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="1128.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Issue / reconcile</text><polyline points="305,340 305,395 595,395 595,460 675,460" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="440" y="380.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Admission sync</text><polyline points="1130,940 1105,940 1105,585 1045,585" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1230" y="755.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Scoped read APIs</text><polyline points="1130,1010 1095,1010 1095,1250 1020,1250" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1170" y="1160.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Knowledge read</text><text x="55" y="1390.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Local services remain independent of the cloud delivery path. Reporting and AI have no physical-control authority.</text><polyline points="55,1482 1545,1482" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1516.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1554.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Rectangles: runtime responsibilities. Cylinders: data stores. Dashed boxes: deployment or application boundaries. Labeled arrows: data or API</text><text x="55" y="1579.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">relationships.</text></g></svg>
