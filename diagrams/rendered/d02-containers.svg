<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1635" viewBox="0 0 1600 1635" role="img" aria-labelledby="title desc"><title id="title">Application responsibilities and data ownership</title><desc id="desc">C4 container view</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1635" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D02-CONTAINERS  /  C4 CONTAINER VIEW</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Application responsibilities and data ownership</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="45" y="175" width="530" height="510" rx="0" fill="#F8FAFC" stroke="#176C5F" stroke-width="2" stroke-dasharray="8 6"/><text x="63" y="205.0" text-anchor="start" font-size="18" font-weight="700" fill="#176C5F">ESTATE / LOCAL NETWORK</text><rect x="620" y="385" width="930" height="700" rx="0" fill="#F8FAFC" stroke="#245A89" stroke-width="2" stroke-dasharray="8 6"/><text x="638" y="415.0" text-anchor="start" font-size="18" font-weight="700" fill="#245A89">APPLICATION SERVICES</text><rect x="80" y="235" width="450" height="105" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="305.0" y="279.69" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Admission authority</text><text x="305.0" y="309.39" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Single writer · redemption journal</text><rect x="80" y="475" width="450" height="145" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="305.0" y="511.69500000000005" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Edge runtime</text><text x="305.0" y="540.0450000000001" text-anchor="middle" font-si