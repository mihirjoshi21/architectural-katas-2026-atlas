<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1305" viewBox="0 0 1600 1305" role="img" aria-labelledby="title desc"><title id="title">From observations to accountable staff decisions</title><desc id="desc">Data lineage</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1305" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D11-POPULARITY  /  DATA LINEAGE</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">From observations to accountable staff decisions</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="95" y="230" width="420" height="110" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="305.0" y="277.19" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Bidirectional entry observations</text><text x="305.0" y="306.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Manual tally · time · coverage</text><polygon points="785.0,205 920,285.0 785.0,365 650,285.0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="785.0" y="275.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Calibrated</text><text x="785.0" y="300.65" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">coverage ≥90%?</text><path d="M1085,235 C1085,208 1505,208 1505,235 L1505,330 C1505,357 1085,357 1085,330 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M1085,235 C1085,262 1505,262 1505,235" fill="none" stroke="#245A89" stroke-width="2"/><text x="1295.0" y="278.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Entries / covered open hour</text><text x="1295.0" y="307.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Valid minutes + calibration</text><rect x="105" y="560" width="420" height="110" rx="0" fill="#FCEEEF" stroke="#A33F49" stroke-width="2"/><text x="315.0" y="607.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Missing / stale data</text><text x="315.0" y="636.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">No invented occupancy</text><rect x="1085" y="570" width="420" height="110" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="1295.0" y="617.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Manager decision</text><text x="1295.0" y="646.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Staff allocation + reason</text><rect x="635" y="865" width="465" height="110" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="867.5" y="912.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Outcome comparison</text><text x="867.5" y="941.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Seasonality and intervention recorded</text><polyline points="515,285 650,285" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="582" y="260.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Validate</text><polyline points="920,285 1085,285" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1005" y="260.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Yes</text><polyline points="785,365 785,450 315,450 315,560" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="429.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">No</text><polyline points="1295,350 1295,570" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1350" y="463.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Inform</text><polyline points="525,615 1085,615" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="593.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Show coverage limits</text><polyline points="1295,680 1295,920 1100,920" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1330" y="813.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Record intervention</text><text x="55" y="1050.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Entries are visits, not unique people. Popularity differs from queue length, dwell time and safe capacity; no identity tracking.</text><polyline points="55,1152 1545,1152" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1186.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1224.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Rectangles: observations, actions or outcomes. Diamond: data-quality gate. Cylinder: derived metric. Arrows: derivation and use. Red box: excluded</text><text x="55" y="1249.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">or missing data.</text></g></svg>
