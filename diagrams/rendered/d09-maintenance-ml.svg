<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1435" viewBox="0 0 1600 1435" role="img" aria-labelledby="title desc"><title id="title">Model lifecycle: offline evidence before live advice</title><desc id="desc">ML lifecycle / release gate</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1435" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D09-MAINTENANCE-ML  /  ML LIFECYCLE / RELEASE GATE</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Model lifecycle: offline evidence before live advice</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="55" y="190" width="1490" height="580" rx="0" fill="#F8FAFC" stroke="#69508E" stroke-width="2" stroke-dasharray="8 6"/><text x="73" y="220.0" text-anchor="start" font-size="18" font-weight="700" fill="#69508E">OFFLINE DEVELOPMENT AND HELD-OUT EVALUATION</text><path d="M110,300 C110,273 455,273 455,300 L455,390 C455,417 110,417 110,390 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M110,300 C110,327 455,327 455,300" fill="none" stroke="#245A89" stroke-width="2"/><text x="282.5" y="343.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Telemetry + outcomes</text><text x="282.5" y="372.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Reviewed time / asset labels</text><rect x="600" y="280" width="380" height="130" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="790.0" y="321.31" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">Versioned feature pipeline</text><text x="790.0" y="352.36" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">Train / validation / test</text><text x="790.0" y="383.41" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">split</text><rect x="1130" y="280" width="340" height="130" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="1300.0" y="336.83500000000004" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">Candidate model</text><text x="1300.0" y="367.88500000000005" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">LightGBM + alternatives</text><rect x="130" y="565" width="345" height="110" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="302.5" y="612.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Inspection / threshold</text><text x="302.5" y="641.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">baseline</text><polygon points="790.0,545 925,625.0 790.0,705 655,625.0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="790.0" y="615.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Benefit and</text><text x="790.0" y="640.65" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">error gate</text><rect x="1120" y="565" width="350" height="110" rx="0" fill="#FCEEEF" stroke="#A33F49" stroke-width="2"/><text x="1295.0" y="612.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Reject / improve data</text><text x="1295.0" y="641.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Keep the baseline</text><rect x="55" y="855" width="1490" height="260" rx="0" fill="#F8FAFC" stroke="#176C5F" stroke-width="2" stroke-dasharray="8 6"/><text x="73" y="885.0" text-anchor="start" font-size="18" font-weight="700" fill="#176C5F">CONTROLLED OPERATION</text><rect x="115" y="925" width="350" height="110" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="290.0" y="971.835" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">Shadow trial</text><text x="290.0" y="1002.885" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">No operational authority</text><rect x="620" y="925" width="360" height="110" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="800.0" y="972.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Mechanic reviews advice</text><text x="800.0" y="1001.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Retains inspection authority</text><rect x="1120" y="925" width="350" height="110" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="1295.0" y="972.5450000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Monitor errors and workload</text><text x="1295.0" y="1000.8950000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Rollback to baseline</text><polyline points="455,345 600,345" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="527" y="322.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Features</text><polyline points="980,345 1130,345" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1055" y="323.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Fit</text><polyline points="1300,410 1300,480 790,480 790,545" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1000" y="458.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Held-out results</text><polyline points="475,620 655,620" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="598.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Compare</text><polyline points="925,620 1120,620" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1020" y="596.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Insufficient</text><polyline points="790,705 790,815 290,815 290,925" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="792.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Human promotion gate</text><polyline points="465,980 620,980" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="542" y="958.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Advisory</text><polyline points="980,980 1120,980" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1050" y="958.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Observe</text><text x="55" y="1190.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Version data, features and model together. Report useful warning time and false alerts; explanations are not causal proof.</text><polyline points="55,1282 1545,1282" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1316.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1354.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Dashed boxes: lifecycle stages. Rectangles: tasks or artifacts. Cylinder: reviewed data. Diamond: release decision. Arrows: development and</text><text x="55" y="1379.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">operational progression.</text></g></svg>
