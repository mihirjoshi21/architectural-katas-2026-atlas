<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1175" viewBox="0 0 1600 1175" role="img" aria-labelledby="title desc"><title id="title">ATLAS in its operating environment</title><desc id="desc">C4 system context</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1175" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D01-CONTEXT  /  C4 SYSTEM CONTEXT</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">ATLAS in its operating environment</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><ellipse cx="225.0" cy="207.0" rx="27.0" ry="27.0" fill="#E9F2F8" stroke="#245A89" stroke-width="2"/><rect x="163" y="242" width="124" height="60" rx="14" fill="#E9F2F8" stroke="#245A89" stroke-width="2"/><text x="225" y="335.0" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Visitors and families</text><ellipse cx="790.0" cy="207.0" rx="27.0" ry="27.0" fill="#E9F2F8" stroke="#245A89" stroke-width="2"/><rect x="728" y="242" width="124" height="60" rx="14" fill="#E9F2F8" stroke="#245A89" stroke-width="2"/><text x="790" y="335.0" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Estate staff</text><ellipse cx="1320.0" cy="207.0" rx="27.0" ry="27.0" fill="#E9F2F8" stroke="#245A89" stroke-width="2"/><rect x="1258" y="242" width="124" height="60" rx="14" fill="#E9F2F8" stroke="#245A89" stroke-width="2"/><text x="1320" y="335.0" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Estate management</text><rect x="490" y="450" width="600" height="170" rx="0" fill="#DCEBF7" stroke="#245A89" stroke-width="2"/><text x="790.0" y="509.25" text-anchor="middle" font-size="25" font-weight="400" fill="#172B3A">ATLAS estate platform</text><text x="790.0" y="543.0" text-anchor="middle" font-size="25" font-weight="400" fill="#172B3A">[Software system]</text><text x="790.0" y="576.75" text-anchor="middle" font-size="25" font-weight="400" fill="#172B3A">Admissions · operations · animal care</text><polyline points="225,350 225,402 790,402 790,450" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="380.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Plan visits and buy passes</text><polyline points="790,350 790,402 790,402 790,450" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="380.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Record, review and operate</text><polyline points="1320,350 1320,402 790,402 790,450" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1320" y="380.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Review outcomes and investment</text><rect x="70" y="770" width="380" height="125" rx="0" fill="#EEF1F4" stroke="#536878" stroke-width="2"/><text x="260.0" y="809.8399999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Estate devices</text><text x="260.0" y="839.54" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">[External systems]</text><text x="260.0" y="869.2399999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Telemetry and observations</text><rect x="610" y="770" width="380" height="125" rx="0" fill="#EEF1F4" stroke="#536878" stroke-width="2"/><text x="800.0" y="809.8399999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Ticket and payment supplier</text><text x="800.0" y="839.54" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">[External system]</text><text x="800.0" y="869.2399999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Issuance and settlement</text><rect x="1150" y="770" width="380" height="125" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="1340.0" y="809.8399999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Model provider</text><text x="1340.0" y="839.54" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">[External system]</text><text x="1340.0" y="869.2399999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Evaluated inference</text><polyline points="260,770 260,680 610,680 610,620" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="657.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Acquired observations</text><polyline points="800,620 800,770" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="930" y="705.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Issue / reconcile</text><polyline points="990,620 990,680 1340,680 1340,770" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1320" y="657.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Bounded inference</text><text x="55" y="960.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Boundary: AI advises; independent physical protection and emergency procedures retain authority.</text><polyline points="55,1022 1545,1022" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1056.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1094.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Person symbols: users. Rectangles: software or external systems. Labeled arrows: interactions. The central blue box is the ATLAS system boundary.</text></g></svg>
