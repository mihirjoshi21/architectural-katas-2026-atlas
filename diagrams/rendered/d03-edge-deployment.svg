<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1425" viewBox="0 0 1600 1425" role="img" aria-labelledby="title desc"><title id="title">Failure domains and physical deployment</title><desc id="desc">Deployment topology</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1425" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D03-EDGE-DEPLOYMENT  /  DEPLOYMENT TOPOLOGY</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Failure domains and physical deployment</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="55" y="190" width="700" height="770" rx="0" fill="#F8FAFC" stroke="#176C5F" stroke-width="2" stroke-dasharray="8 6"/><text x="73" y="220.0" text-anchor="start" font-size="18" font-weight="700" fill="#176C5F">ESTATE SITE — LOCAL POWER AND NETWORK</text><rect x="885" y="190" width="650" height="770" rx="0" fill="#F8FAFC" stroke="#245A89" stroke-width="2" stroke-dasharray="8 6"/><text x="903" y="220.0" text-anchor="start" font-size="18" font-weight="700" fill="#245A89">CLOUD REGION — MANAGED SERVICES</text><rect x="90" y="250" width="285" height="100" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="232.5" y="292.19" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Sensors</text><text x="232.5" y="321.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Wired / local IP radio</text><rect x="425" y="250" width="285" height="100" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="567.5" y="292.19" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Gateway</text><text x="567.5" y="321.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Broker + edge runtime</text><path d="M425,460 C425,433 710,433 710,460 L710,540 C710,567 425,567 425,540 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M425,460 C425,487 710,487 710,460" fill="none" stroke="#245A89" stroke-width="2"/><text x="567.5" y="503.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Local SQLite</text><text x="567.5" y="532.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Pending + 7-day archive</text><rect x="90" y="460" width="285" height="100" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="232.5" y="489.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Staff kiosk</text><text x="232.5" y="516.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Capture only while</text><text x="232.5" y="543.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">offline</text><rect x="90" y="715" width="285" height="110" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="232.5" y="749.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Gate validators</text><text x="232.5" y="776.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Provisioned admission</text><text x="232.5" y="803.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">LAN</text><rect x="425" y="710" width="285" height="135" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="567.5" y="756.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Admission authority</text><text x="567.5" y="783.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Protected host + UPS</text><text x="567.5" y="810.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Fenced spare recovery</text><rect x="960" y="275" width="500" height="115" rx="0" fill="#DCEBF7" stroke="#245A89" stroke-width="2"/><text x="1210.0" y="324.69" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Managed application / ingestion</text><text x="1210.0" y="354.39" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Authenticated inbound endpoint</text><path d="M960,530 C960,503 1460,503 1460,530 L1460,635 C1460,662 960,662 960,635 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M960,530 C960,557 1460,557 1460,530" fill="none" stroke="#245A89" stroke-width="2"/><text x="1210.0" y="573.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Managed PostgreSQL</text><text x="1210.0" y="602.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Transactions · PITR / restore</text><rect x="960" y="785" width="500" height="110" rx="0" fill="#EAF2F9" stroke="#245A89" stroke-width="2"/><text x="1210.0" y="832.1899999999999" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Object storage and backups</text><text x="1210.0" y="861.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Controlled access and retention</text><polyline points="375,300 425,300" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="280.0" text-anchor="middle" font-size="16" font-weight="400" fill="#172B3A">MQTT</text><polyline points="565,350 565,440" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="400.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Durable commit</text><polyline points="375,510 405,510 405,350 425,330" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="397" y="423.0" text-anchor="middle" font-size="16" font-weight="400" fill="#172B3A">LAN</text><polyline points="375,770 425,770" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="750.0" text-anchor="middle" font-size="16" font-weight="400" fill="#172B3A">LAN</text><polyline points="710,295 960,295" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="830" y="270.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">HTTPS / WAN</text><polyline points="1210,390 1210,510" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1340" y="455.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Atomic writes</text><polyline points="1210,655 1210,785" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1350" y="720.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Restore and retention</text><polyline points="810,165 810,995" fill="none" stroke="#A33F49" stroke-width="2" stroke-dasharray="7 6"/><text x="812" y="1038.0" text-anchor="middle" font-size="19" font-weight="400" fill="#A33F49">WAN outage boundary</text><rect x="70" y="1080" width="1460" height="90" rx="0" fill="#FFFFFF" stroke="#536878" stroke-width="2"/><text x="800.0" y="1132.36" text-anchor="middle" font-size="23" font-weight="400" fill="#172B3A">Sensor-link loss ≠ WAN loss ≠ local power/storage loss. Guest access has no route to device or admission control.</text><polyline points="55,1272 1545,1272" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1306.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1344.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Rectangles: deployed devices or services. Cylinders: persisted data. Dashed boxes: failure domains. Red dashed line: WAN boundary. Arrows:</text><text x="55" y="1369.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">communication paths.</text></g></svg>
