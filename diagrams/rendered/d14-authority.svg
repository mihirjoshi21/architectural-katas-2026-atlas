="middle" font-size="20" font-weight="400" fill="#172B3A">No</text><rect x="1280" y="795" width="225" height="115" rx="0" fill="#E7F3EF" stroke="#C6D3DD" stroke-width="2"/><text x="1392.5" y="858.9" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Independent policy</text><text x="55" y="985.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Role policy is task-specific. Physical protection remains independently engineered; this matrix does not define clinical permissions.</text><polyline points="55,1102 1545,1102" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1136.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1174.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Rows: actors or roles. Columns: capabilities. Red No cells: prohibited. Green cells: the stated scope only. Text in each cell defines authority;</text><text x="55" y="1199.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">color is a reading aid.</text></g></svg>
