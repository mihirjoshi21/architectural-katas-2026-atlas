polyline points="800,340 800,440" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="397.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Validate connected actor and evidence</text><polyline points="610,487 410,487" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="465.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Reject</text><polyline points="800,535 800,655" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1035" y="598.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Qualified scoped approval</text><polyline points="990,705 1130,705" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1060" y="684.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Stale</text><polyline points="1305,655 1305,488 990,488" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1320" y="464.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Re-review</text><polyline points="800,755 800,875" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1060" y="820.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Recheck role, version and expiry</text><polyline points="800,975 800,1040" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><polygon points="800.0,1040 890,1090.0 800.0,1140 710,1090.0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="800.0" y="1080.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Reported</text><text x="800.0" y="1105.65" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Outcome?</text><polyline points="710,1090 320,1090 320,1190" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="1068.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Completed</text><polyline points="800,1140 800,1190" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="1168.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Failed</text><polyline points="890,1090 1280,1090 1280,1190" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1120" y="1068.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Unknown</text><polyline points="1455,1240 1510,1240 1510,365 1490,365" fill="none" stroke="#91651F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="1150" y="310" width="340" height="110" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="1320.0" y="345.43" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Unknown outcome: qualified</text><text x="1320.0" y="371.08" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">reconciliation before any</text><text x="1320.0" y="396.73" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">new action</text><text x="55" y="1390.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Deduplicate digital reports by attempt ID. Do not automatically repeat a physical action with an unknown outcome.</text><text x="55" y="1430.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Capture grants expire after 12 hours; manual records and established emergency procedures remain available.</text><polyline points="55,1562 1545,1562" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1596.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1634.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Rounded boxes: states. Filled circle: initial state. Diamond: outcome branch. Solid arrows: transitions. Dashed line and amber note: required</text><text x="55" y="1659.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">follow-up review.</text></g></svg>
