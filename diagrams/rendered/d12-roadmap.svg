E5EB" stroke-width="2"/><text x="1480.0" y="205.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">M36</text><text x="65" y="303.0" text-anchor="start" font-size="23" font-weight="700" fill="#172B3A">Discovery and pilot</text><text x="65" y="335.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">Survey · local operation · baseline</text><rect x="440.0" y="270" width="57.77777777777777" height="65" rx="0" fill="#176C5F" stroke="#176C5F" stroke-width="2"/><polygon points="497.77777777777777,289 507.77777777777777,303.0 497.77777777777777,317 487.77777777777777,303.0" fill="#FFFFFF" stroke="#91651F" stroke-width="2"/><text x="65" y="418.0" text-anchor="start" font-size="23" font-weight="700" fill="#172B3A">Foundation</text><text x="65" y="450.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">Tickets · records · restore</text><rect x="440.0" y="385" width="115.55555555555554" height="65" rx="0" fill="#245A89" stroke="#245A89" stroke-width="2"/><polygon points="555.5555555555555,404 565.5555555555555,418.0 555.5555555555555,432 545.5555555555555,418.0" fill="#FFFFFF" stroke="#91651F" stroke-width="2"/><text x="65" y="533.0" text-anchor="start" font-size="23" font-weight="700" fill="#172B3A">Operational insight</text><text x="65" y="565.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">Useful observations and reporting</text><rect x="555.5555555555555" y="500" width="115.55555555555554" height="65" rx="0" fill="#176C5F" stroke="#176C5F" stroke-width="2"/><polygon points="671.1111111111111,519 681.1111111111111,533.0 671.1111111111111,547 661.1111111111111,533.0" fill="#FFFFFF" stroke="#91651F" stroke-width="2"/><text x="65" y="648.0" text-anchor="start" font-size="23" font-weight="700" fill="#172B3A">Bounded AI trials</text><text x="65" y="680.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">Held-out quality and workload</text><rect x="671.1111111111111" y="615" width="115.55555555555566" height="65" rx="0" fill="#69508E" stroke="#69508E" stroke-width="2"/><polygon points="786.6666666666667,634 796.6666666666667,648.0 786.6666666666667,662 776.6666666666667,648.0" fill="#FFFFFF" stroke="#91651F" stroke-width="2"/><text x="65" y="763.0" text-anchor="start" font-size="23" font-weight="700" fill="#172B3A">Validated expansion</text><text x="65" y="795.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">Seasonal value and sustainable cost</text><rect x="786.6666666666667" y="730" width="693.3333333333333" height="65" rx="0" fill="#245A89" stroke="#245A89" stroke-width="2"/><polygon points="1480.0,749 1490.0,763.0 1480.0,777 1470.0,763.0" fill="#FFFFFF" stroke="#91651F" stroke-width="2"/><text x="55" y="915.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Gate diamonds authorize the next scope, not a calendar promise. Stop a failed model trial independently of useful core operations.</text><text x="55" y="954.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">The eight-week pilot is capped at EUR 37,800 in the planning model; the full envelope is not an immediate funding commitment.</text><polyline points="55,1062 1545,1062" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1096.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1134.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Bars: planned work periods. Diamonds: funding or release gates. Vertical guides: relative months from project start. Bar colors distinguish</text><text x="55" y="1159.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">workstreams, not achieved progress.</text></g></svg>
