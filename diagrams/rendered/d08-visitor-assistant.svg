<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1685" viewBox="0 0 1600 1685" role="img" aria-labelledby="title desc"><title id="title">Candidate selection, checked facts and controlled presentation</title><desc id="desc">Data-flow and trust view</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1685" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D08-VISITOR-ASSISTANT  /  DATA-FLOW AND TRUST VIEW</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Candidate selection, checked facts and controlled presentation</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="580" y="185" width="440" height="85" rx="0" fill="#FCEEEF" stroke="#A33F49" stroke-width="2"/><text x="800.0" y="219.69" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Visitor request</text><text x="800.0" y="249.39" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Untrusted input</text><rect x="80" y="340" width="1040" height="790" rx="0" fill="#F8FAFC" stroke="#176C5F" stroke-width="2" stroke-dasharray="8 6"/><text x="98" y="370.0" text-anchor="start" font-size="18" font-weight="700" fill="#176C5F">ESTATE POLICY BOUNDARY</text><rect x="150" y="415" width="380" height="105" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="340.0" y="445.87" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Request policy</text><text x="340.0" y="474.22" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Permissions · rate · cost</text><text x="340.0" y="502.57" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">reserve</text><path d="M150,665 C150,638 530,638 530,665 L530,755 C530,782 150,782 150,755 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M150,665 C150,692 530,692 530,665" fill="none" stroke="#245A89" stroke-width="2"/><text x="340.0" y="708.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Approved knowledge</text><text x="340.0" y="737.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Version + expiry + source</text><rect x="640" y="655" width="405" height="120" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="842.5" y="693.37" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Authoritative activity facts</text><text x="842.5" y="721.72" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Visitor-confirmed constraints</text><text x="842.5" y="750.07" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Scoped read APIs</text><rect x="640" y="420" width="405" height="105" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="842.5" y="465.045" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Versioned AI adapter</text><text x="842.5" y="493.39500000000004" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Deadline and provider contract</text><rect x="1230" y="415" width="300" height="160" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="1380.0" y="472.34000000000003" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">External model</text><text x="1380.0" y="502.04" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Candidate IDs + sources</text><text x="1380.0" y="531.74" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Untrusted output</text><rect x="640" y="930" width="405" height="155" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="842.5" y="985.87" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Deterministic checks</text><text x="842.5" y="1014.22" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Schema · IDs · source mapping</text><text x="842.5" y="1042.57" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Freshness · confirmed constraints</text><rect x="150" y="950" width="380" height="105" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="340.0" y="995.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">Approved search / staff help</text><text x="340.0" y="1022.4" text-anchor="middle" font-size="20" font-weight="400" fill="#172B3A">When evidence or service fails</text><rect x="605" y="1190" width="460" height="100" rx="0" fill="#DCEBF7" stroke="#245A89" stroke-width="2"/><text x="835.0" y="1232.19" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Approved fact cards / excerpts</text><text x="835.0" y="1261.89" text-anchor="middle" font-size="22" font-weight="400" fill="#172B3A">Sources and freshness visible</text><polyline points="800,270 800,315 340,315 340,415" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="295.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Validate</text><polyline points="530,465 640,465" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="585" y="445.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Allowed</text><polyline points="150,465 110,465 110,1000 150,1000" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="907.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Policy failure</text><polyline points="340,645 340,580 765,580 765,525" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="560.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Retrieve</text><polyline points="842,655 842,525" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="950" y="593.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Read facts</text><polyline points="1045,460 1230,460" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1137" y="440.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Bounded call</text><polyline points="1380,575 1380,1000 1045,1000" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1370" y="875.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Candidate response</text><polyline points="842,775 842,930" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="880" y="860.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Authoritative facts / constraints</text><polyline points="842,1085 842,1190" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="885" y="1130.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Pass</text><polyline points="640,1000 530,1000" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="585" y="980.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Fail</text><polyline points="340,1055 340,1240 605,1240" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="425" y="1218.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Fallback</text><rect x="1190" y="1140" width="350" height="160" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="1365.0" y="1187.605" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Release evaluation + operation</text><text x="1365.0" y="1213.255" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Human-reviewed quality gates</text><text x="1365.0" y="1238.905" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Daily sampled task review</text><text x="1365.0" y="1264.555" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Feature switch to search</text><text x="55" y="1380.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Initial activity cards use templates; general information uses approved excerpts. No unrestricted model prose.</text><text x="55" y="1430.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">No write tools. If cost authority is unavailable, no new provider call starts. Retrieved content cannot grant permissions.</text><polyline points="55,1532 1545,1532" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1566.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1604.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Rectangles: processing or presentation. Cylinders: approved data. Dashed box: estate policy boundary. Labeled arrows: information flow. Amber</text><text x="55" y="1629.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">boxes: fallback or evaluation controls.</text></g></svg>
