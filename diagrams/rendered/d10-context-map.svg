<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1225" viewBox="0 0 1600 1225" role="img" aria-labelledby="title desc"><title id="title">Business boundaries and published contracts</title><desc id="desc">Domain context map</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1225" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D10-CONTEXT-MAP  /  DOMAIN CONTEXT MAP</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Business boundaries and published contracts</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="70" y="200" width="450" height="340" rx="0" fill="#F8FAFC" stroke="#245A89" stroke-width="2" stroke-dasharray="8 6"/><text x="88" y="230.0" text-anchor="start" font-size="18" font-weight="700" fill="#245A89">VISITOR &amp; ADMISSIONS</text><rect x="575" y="200" width="450" height="340" rx="0" fill="#F8FAFC" stroke="#176C5F" stroke-width="2" stroke-dasharray="8 6"/><text x="593" y="230.0" text-anchor="start" font-size="18" font-weight="700" fill="#176C5F">PARK OPERATIONS</text><rect x="1080" y="200" width="450" height="340" rx="0" fill="#F8FAFC" stroke="#91651F" stroke-width="2" stroke-dasharray="8 6"/><text x="1098" y="230.0" text-anchor="start" font-size="18" font-weight="700" fill="#91651F">ANIMAL CARE</text><text x="100" y="280.0" text-anchor="start" font-size="24" font-weight="400" fill="#245A89">Entitlements and redemption</text><text x="100" y="312.4" text-anchor="start" font-size="24" font-weight="400" fill="#245A89">Party allowance and re-entry</text><text x="100" y="344.8" text-anchor="start" font-size="24" font-weight="400" fill="#245A89">Saved plans and preferences</text><text x="605" y="280.0" text-anchor="start" font-size="24" font-weight="400" fill="#176C5F">Ride status and work orders</text><text x="605" y="312.4" text-anchor="start" font-size="24" font-weight="400" fill="#176C5F">Zone observations</text><text x="605" y="344.8" text-anchor="start" font-size="24" font-weight="400" fill="#176C5F">Staffing decisions</text><text x="1110" y="280.0" text-anchor="start" font-size="24" font-weight="400" fill="#91651F">Health and feeding</text><text x="1110" y="312.4" text-anchor="start" font-size="24" font-weight="400" fill="#91651F">Confirmed population</text><text x="1110" y="344.8" text-anchor="start" font-size="24" font-weight="400" fill="#91651F">Care tasks and approvals</text><rect x="70" y="700" width="450" height="140" rx="0" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><text x="295.0" y="748.37" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">TicketIssued</text><text x="295.0" y="776.72" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">AdmissionRecorded</text><text x="295.0" y="805.07" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">ExitRecorded</text><rect x="575" y="700" width="450" height="140" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="800.0" y="748.37" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">RideStatusChanged</text><text x="800.0" y="776.72" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">ZoneObservationRecorded</text><text x="800.0" y="805.07" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">StaffAllocationRecorded</text><rect x="1080" y="700" width="450" height="140" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="1305.0" y="748.37" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">FeedingObservationRecorded</text><text x="1305.0" y="776.72" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">PopulationConfirmed</text><text x="1305.0" y="805.07" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">CareActionCompleted</text><polyline points="295,540 295,700" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="620.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Published contracts</text><polyline points="800,540 800,700" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="620.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Published contracts</text><polyline points="1305,540 1305,700" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1305" y="620.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Published contracts</text><text x="55" y="920.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">One physical PostgreSQL deployment; separate schema ownership and explicit APIs/events. Boundaries do not imply microservices.</text><polyline points="55,1072 1545,1072" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1106.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1144.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Dashed boxes: domain ownership. Rectangles below: published event contracts. Arrows: contract publication. Colors distinguish domains; they do not</text><text x="55" y="1169.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">grant permissions.</text></g></svg>
