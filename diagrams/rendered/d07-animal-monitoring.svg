<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1625" viewBox="0 0 1600 1625" role="img" aria-labelledby="title desc"><title id="title">Animal observations: estimate, review, confirm</title><desc id="desc">Activity swimlanes</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536878"/></marker></defs><rect width="1600" height="1625" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="48.0" text-anchor="start" font-size="17" font-weight="400" fill="#536878">D07-ANIMAL-MONITORING  /  ACTIVITY SWIMLANES</text><text x="55" y="100.0" text-anchor="start" font-size="34" font-weight="700" fill="#172B3A">Animal observations: estimate, review, confirm</text><polyline points="55,132 1545,132" fill="none" stroke="#D8E1E6" stroke-width="2"/><rect x="55" y="180" width="450" height="1115" rx="0" fill="#F8FAFC" stroke="#176C5F" stroke-width="2" stroke-dasharray="8 6"/><text x="73" y="210.0" text-anchor="start" font-size="18" font-weight="700" fill="#176C5F">CAPTURE</text><rect x="545" y="180" width="500" height="1115" rx="0" fill="#F8FAFC" stroke="#69508E" stroke-width="2" stroke-dasharray="8 6"/><text x="563" y="210.0" text-anchor="start" font-size="18" font-weight="700" fill="#69508E">ANALYTICS</text><rect x="1085" y="180" width="460" height="1115" rx="0" fill="#F8FAFC" stroke="#91651F" stroke-width="2" stroke-dasharray="8 6"/><text x="1103" y="210.0" text-anchor="start" font-size="18" font-weight="700" fill="#91651F">KEEPER</text><rect x="105" y="255" width="350" height="100" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="280.0" y="297.545" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Feeding / health observation</text><text x="280.0" y="325.89500000000004" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">or permitted footage</text><polygon points="795.0,240 935,315.0 795.0,390 655,315.0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="795.0" y="305.0" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Quality</text><text x="795.0" y="330.65" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">usable?</text><rect x="605" y="505" width="380" height="100" rx="0" fill="#F0EAF7" stroke="#69508E" stroke-width="2"/><text x="795.0" y="547.5450000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Rules / visible-count candidate</text><text x="795.0" y="575.8950000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Region · coverage · uncertainty</text><rect x="1135" y="265" width="360" height="100" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="1315.0" y="307.545" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Manual observation</text><text x="1315.0" y="335.89500000000004" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">when capture is unusable</text><rect x="1135" y="690" width="360" height="105" rx="0" fill="#FFF7E8" stroke="#91651F" stroke-width="2"/><text x="1315.0" y="720.87" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Review discrepancy</text><text x="1315.0" y="749.22" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Separate visible count from</text><text x="1315.0" y="777.57" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">total</text><path d="M1125,1050 C1125,1023 1505,1023 1505,1050 L1505,1145 C1505,1172 1125,1172 1125,1145 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M1125,1050 C1125,1077 1505,1077 1505,1050" fill="none" stroke="#245A89" stroke-width="2"/><text x="1315.0" y="1093.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Confirmed records</text><text x="1315.0" y="1122.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Keeper decision and provenance</text><path d="M615,1050 C615,1023 980,1023 980,1050 L980,1145 C980,1172 615,1172 615,1145 Z" fill="#EEF5FA" stroke="#245A89" stroke-width="2"/><path d="M615,1050 C615,1077 980,1077 980,1050" fill="none" stroke="#245A89" stroke-width="2"/><text x="797.5" y="1093.0" text-anchor="middle" font-size="21" font-weight="700" fill="#172B3A">Model observations</text><text x="797.5" y="1122.0" text-anchor="middle" font-size="17" font-weight="400" fill="#536878">Estimate kept separately</text><rect x="115" y="730" width="330" height="105" rx="0" fill="#E7F3EF" stroke="#176C5F" stroke-width="2"/><text x="280.0" y="775.0450000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Reviewed labels</text><text x="280.0" y="803.3950000000001" text-anchor="middle" font-size="21" font-weight="400" fill="#172B3A">Conditions and uncertainty</text><polyline points="455,305 655,305" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="285.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Input</text><polyline points="795,390 795,505" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="840" y="450.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Yes</text><polyline points="935,315 1135,315" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1035" y="295.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">No</text><polyline points="1315,365 1315,690" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1415" y="510.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Observe / record</text><polyline points="985,555 1035,555 1035,740 1135,740" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1060" y="660.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Candidate</text><polyline points="795,605 795,1030" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="900.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Retain estimate</text><polyline points="1315,795 1315,1030" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="1400" y="925.0" text-anchor="middle" font-size="17" font-weight="400" fill="#172B3A">Confirm or correct</text><polyline points="1135,750 1060,750 1060,965 280,965 280,835" fill="none" stroke="#536878" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="940.0" text-anchor="middle" font-size="18" font-weight="400" fill="#172B3A">Feedback for held-out evaluation</text><text x="55" y="1380.0" text-anchor="start" font-size="18" font-weight="400" fill="#536878">Visible fish counts are not enclosure totals. Without an independent census reference, total population stays unverified.</text><polyline points="55,1472 1545,1472" fill="none" stroke="#D8E1E6" stroke-width="2"/><text x="55" y="1506.0" text-anchor="start" font-size="17" font-weight="700" fill="#536878">NOTATION KEY</text><text x="55" y="1544.0" text-anchor="start" font-size="19" font-weight="400" fill="#536878">Dashed lanes: responsibility owner. Rectangles: activities. Diamond: quality decision. Cylinders: retained records. Arrows: observation and review</text><text x="55" y="1569.65" text-anchor="start" font-size="19" font-weight="400" fill="#536878">flow.</text></g></svg>
