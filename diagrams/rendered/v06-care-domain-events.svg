<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1510" viewBox="0 0 1500 1510"><rect width="1500" height="1510" fill="white"/><text x="54" y="38" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#16877f" font-weight="700">06 / ANIMAL CARE DOMAIN EVENTS</text><text x="54" y="82" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#20314d" font-weight="700">From feeding observations to accountable outcomes</text><text x="54" y="120" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#536780">Document-based event-storming synthesis · command → event · explicit authority</text><rect x="54" y="150" width="1392" height="85" rx="8" fill="#fff0d5" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="179" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Urgent help follows established local procedures immediately.</text><text x="72" y="219.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Emergency notification does not wait for digital approval or cloud synchronization.</text><rect x="54" y="255" width="205" height="39" rx="8" fill="#fff3b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="68" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20314d" font-weight="700">Actor</text><rect x="279" y="255" width="205" height="39" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="293" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20314d" font-weight="700">Command</text><rect x="504" y="255" width="205" height="39" rx="8" fill="#ffe0b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="518" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20314d" font-weight="700">Domain event</text><rect x="729" y="255" width="205" height="39" rx="8" fill="#eee6f8" stroke="#cbd7e3" stroke-width="1.5"/><text x="743" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20314d" font-weight="700">Policy</text><rect x="954" y="255" width="205" height="39" rx="8" fill="#fae3ee" stroke="#cbd7e3" stroke-width="1.5"/><text x="968" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20314d" font-weight="700">Open question</text><rect x="54" y="319" width="450" height="471" rx="8" fill="#f8fafc" stroke="#cbd7e3" stroke-width="1.5"/><text x="74" y="351" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#20314d" font-weight="700">1. CAPTURE</text><rect x="525" y="319" width="450" height="471" rx="8" fill="#f8fafc" stroke="#cbd7e3" stroke-width="1.5"/><text x="545" y="351" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#20314d" font-weight="700">2. REVIEW</text><rect x="996" y="319" width="450" height="471" rx="8" fill="#f8fafc" stroke="#cbd7e3" stroke-width="1.5"/><text x="1016" y="351" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#20314d" font-weight="700">3. AUTHORIZE AN ATTEMPT</text><rect x="74" y="371" width="410" height="57" rx="8" fill="#fff3b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="92" y="400" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Keeper</text><rect x="74" y="449" width="410" height="59" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="92" y="478" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">RecordFeedingObservation</text><path d="M279 508 L279 534" fill="none" stroke="#536780" stroke-width="2"/><polyline points="273.7263190753538,524.3465918192059 279,534 284.2736809246462,524.3465918192059" fill="none" stroke="#536780" stroke-width="2"/><rect x="74" y="539" width="410" height="59" rx="8" fill="#ffe0b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="92" y="568" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">FeedingObservationRecorded</text><rect x="74" y="625" width="410" height="141" rx="8" fill="#eee6f8" stroke="#cbd7e3" stroke-width="1.5"/><text x="92" y="654" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Preserve observation quality</text><text x="92" y="694.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Keep observer, units, time and</text><text x="92" y="719.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">quality. Validate offline drafts on</text><text x="92" y="743.52" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">reconnect; quarantine failures.</text><rect x="545" y="371" width="410" height="57" rx="8" fill="#fff3b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="563" y="400" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Qualified care reviewer</text><rect x="545" y="449" width="410" height="59" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="563" y="478" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">ReviewCareAction</text><path d="M750 508 L750 534" fill="none" stroke="#536780" stroke-width="2"/><polyline points="744.7263190753538,524.3465918192059 750,534 755.2736809246462,524.3465918192059" fill="none" stroke="#536780" stroke-width="2"/><rect x="545" y="539" width="410" height="93" rx="8" fill="#ffe0b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="563" y="568" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">CareActionApproved</text><text x="563" y="608.56" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#20314d">OR CareActionRejected</text><rect x="545" y="655" width="410" height="111" rx="8" fill="#eee6f8" stroke="#cbd7e3" stroke-width="1.5"/><text x="563" y="684" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Bind the approval</text><text x="563" y="724.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Task/version, action, actor, expiry.</text><text x="563" y="749.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Changed evidence requires re-review.</text><rect x="1016" y="371" width="410" height="57" rx="8" fill="#fff3b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="1034" y="400" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Authorized care staff</text><rect x="1016" y="449" width="410" height="59" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="1034" y="478" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">AuthorizeActionAttempt</text><path d="M1221 508 L1221 534" fill="none" stroke="#536780" stroke-width="2"/><polyline points="1215.7263190753538,524.3465918192059 1221,534 1226.2736809246462,524.3465918192059" fill="none" stroke="#536780" stroke-width="2"/><rect x="1016" y="539" width="410" height="59" rx="8" fill="#ffe0b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="1034" y="568" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">CareActionAttemptAuthorized</text><rect x="1016" y="625" width="410" height="141" rx="8" fill="#eee6f8" stroke="#cbd7e3" stroke-width="1.5"/><text x="1034" y="654" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Current approval required</text><text x="1034" y="694.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Recheck role, current authority, task</text><text x="1034" y="719.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">version and expiry. Record attempt ID.</text><text x="1034" y="743.52" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Approval is not completion.</text><text x="67" y="822" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#536780" font-weight="700">Accepted observation → qualified review → approved task → authorization → staff action attempt</text><text x="54" y="868" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20314d" font-weight="700">4. REPORT THE OUTCOME OF THAT ATTEMPT</text><rect x="500" y="891" width="500" height="84" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="518" y="920" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">ReportCareOutcome</text><text x="518" y="960.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Actor: staff who performed the attempt</text><path d="M750 975 L750 1003" fill="none" stroke="#536780" stroke-width="2"/><path d="M279 1003 L1221 1003" fill="none" stroke="#536780" stroke-width="2"/><path d="M279 1003 L279 1025" fill="none" stroke="#536780" stroke-width="2"/><polyline points="273.7263190753538,1015.3465918192059 279,1025 284.2736809246462,1015.3465918192059" fill="none" stroke="#536780" stroke-width="2"/><path d="M750 1003 L750 1025" fill="none" stroke="#536780" stroke-width="2"/><polyline points="744.7263190753538,1015.3465918192059 750,1025 755.2736809246462,1015.3465918192059" fill="none" stroke="#536780" stroke-width="2"/><path d="M1221 1003 L1221 1025" fill="none" stroke="#536780" stroke-width="2"/><polyline points="1215.7263190753538,1015.3465918192059 1221,1025 1226.2736809246462,1015.3465918192059" fill="none" stroke="#536780" stroke-width="2"/><rect x="54" y="1028" width="450" height="90" rx="8" fill="#ffe0b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">CareActionCompleted</text><text x="72" y="1097.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Record completion against the attempt.</text><rect x="525" y="1028" width="450" height="90" rx="8" fill="#ffe0b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="543" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">CareActionFailed</text><text x="543" y="1097.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Record failure and reason for follow-up.</text><rect x="996" y="1028" width="450" height="90" rx="8" fill="#ffe0b8" stroke="#cbd7e3" stroke-width="1.5"/><text x="1014" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">CareActionOutcomeUnknown</text><text x="1014" y="1097.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Physical outcome is uncertain.</text><rect x="54" y="1145" width="921" height="116" rx="8" fill="#eee6f8" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="1174" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Alternative outcomes — not successive states</text><text x="72" y="1214.56" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#20314d">Deduplicate digital reports. A delivery receipt or retry never establishes that a</text><text x="72" y="1241.76" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#20314d">physical care action occurred.</text><path d="M1221 1118 L1221 1140" fill="none" stroke="#536780" stroke-width="2"/><polyline points="1215.7263190753538,1130.346591819206 1221,1140 1226.2736809246462,1130.346591819206" fill="none" stroke="#536780" stroke-width="2"/><rect x="996" y="1145" width="450" height="116" rx="8" fill="#eee6f8" stroke="#cbd7e3" stroke-width="1.5"/><text x="1014" y="1174" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Qualified reconciliation</text><text x="1014" y="1214.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Before any new action. Never automatically</text><text x="1014" y="1239.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">repeat an uncertain physical action.</text><text x="54" y="1304" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#20314d" font-weight="700">OPEN DOMAIN QUESTIONS · annotations, not execution steps</text><rect x="54" y="1322" width="450" height="96" rx="8" fill="#fae3ee" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="1351" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Who may approve each action, and for how</text><text x="72" y="1376.84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">long?</text><rect x="525" y="1322" width="450" height="96" rx="8" fill="#fae3ee" stroke="#cbd7e3" stroke-width="1.5"/><text x="543" y="1351" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Which reference methods distinguish</text><text x="543" y="1376.84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">individual and group feeding?</text><rect x="996" y="1322" width="450" height="96" rx="8" fill="#fae3ee" stroke="#cbd7e3" stroke-width="1.5"/><text x="1014" y="1351" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">What local escalation applies when</text><text x="1014" y="1376.84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">digital authority is unavailable?</text><path d="M54 1446 L1446 1446" fill="none" stroke="#cbd7e3" stroke-width="2"/><text x="54" y="1472" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536780">No model, MQTT receipt or synchronization acknowledgement grants physical-action authority. Detail: EVENT_STORMING.md; ADR-006.</text></svg>