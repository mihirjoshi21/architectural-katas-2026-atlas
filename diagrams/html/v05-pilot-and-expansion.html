<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>v05-pilot-and-expansion</title><style>body{margin:0;background:#edf1f5}main{max-width:1500px;margin:auto;background:white}svg{width:100%;height:auto;display:block}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1490" viewBox="0 0 1500 1490"><rect width="1500" height="1490" fill="white"/><text x="54" y="38" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#16877f" font-weight="700">05 / PILOT DEPLOYMENT AND EXPANSION</text><text x="54" y="82" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#20314d" font-weight="700">Build the foundation; expand only on evidence</text><text x="54" y="120" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#536780">One estate · eight-week pilot · independent continuation decisions</text><rect x="54" y="155" width="660" height="520" rx="8" fill="#f7f9fc" stroke="#cbd7e3" stroke-width="1.5"/><rect x="786" y="155" width="660" height="520" rx="8" fill="#f7f9fc" stroke="#cbd7e3" stroke-width="1.5"/><text x="78" y="192" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#20314d" font-weight="700">ESTATE LOCAL NETWORK</text><text x="810" y="192" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#20314d" font-weight="700">CLOUD APPLICATION AND DATA</text><rect x="78" y="216" width="300" height="192" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="96" y="245" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Admission authority</text><text x="96" y="285.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Single admission domain.</text><text x="96" y="311.4" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Durable redemption</text><text x="96" y="337.24" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">journal. Isolated gates</text><text x="96" y="363.08000000000004" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">use staffed exceptions.</text><rect x="396" y="216" width="294" height="192" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="414" y="245" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Edge gateways</text><text x="414" y="285.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">4 active + 1 spare</text><text x="414" y="311.4" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">24 sensors: 4 entrance</text><text x="414" y="337.24" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">counters + 20</text><text x="414" y="363.08000000000004" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">ride/environment sensors.</text><rect x="78" y="434" width="612" height="98" rx="8" fill="#dff1eb" stroke="#cbd7e3" stroke-width="1.5"/><text x="96" y="463" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Local links and power</text><text x="96" y="503.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Surveyed IP links carry MQTT. Gateways retain observations</text><text x="96" y="528.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">locally during WAN loss.</text><rect x="78" y="550" width="612" height="104" rx="8" fill="#dff1eb" stroke="#cbd7e3" stroke-width="1.5"/><text x="96" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Keeper device: capture-only drafts</text><text x="96" y="619.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Offline grant up to 12 hours; validate on reconnect. No new</text><text x="96" y="644.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">offline care approval or execution authority.</text><rect x="810" y="216" width="612" height="98" rx="8" fill="#e4edf9" stroke="#cbd7e3" stroke-width="1.5"/><text x="828" y="245" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">One modular estate application</text><text x="828" y="285.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Visitor &amp; Admissions · Park Operations · Animal Care</text><rect x="810" y="336" width="294" height="140" rx="8" fill="#fff" stroke="#cbd7e3" stroke-width="1.5"/><text x="828" y="365" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Ingestion workers</text><text x="828" y="405.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Commit event identity +</text><text x="828" y="430.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">business effect; return</text><text x="828" y="454.52000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">durable receipt.</text><rect x="1124" y="336" width="298" height="140" rx="8" fill="#fff" stroke="#cbd7e3" stroke-width="1.5"/><text x="1142" y="365" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Reporting workers</text><text x="1142" y="405.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Coverage-aware counts and</text><text x="1142" y="430.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">approved operational read</text><text x="1142" y="454.52000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">models.</text><rect x="810" y="498" width="294" height="130" rx="8" fill="#fff" stroke="#cbd7e3" stroke-width="1.5"/><text x="828" y="527" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Managed PostgreSQL</text><text x="828" y="567.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Owned schemas; approved</text><text x="828" y="592.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">read model</text><rect x="1124" y="498" width="298" height="130" rx="8" fill="#fff" stroke="#cbd7e3" stroke-width="1.5"/><text x="1142" y="527" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Object storage</text><text x="1142" y="567.56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">Approved documents,</text><text x="1142" y="592.04" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20314d">evidence and backups</text><path d="M714 374 L786 374" fill="none" stroke="#536780" stroke-width="2"/><polyline points="776.3465918192059,379.2736809246462 786,374 776.3465918192059,368.7263190753538" fill="none" stroke="#536780" stroke-width="2"/><path d="M786 400 L714 400" fill="none" stroke="#536780" stroke-width="2"/><polyline points="723.6534081807941,394.7263190753538 714,400 723.6534081807941,405.2736809246462" fill="none" stroke="#536780" stroke-width="2"/><text x="725" y="355" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536780" font-weight="700">WAN</text><rect x="54" y="698" width="1392" height="94" rx="8" fill="#dff1eb" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="727" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Across the WAN</text><text x="72" y="767.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Authenticated uploads and admission synchronization → cloud; durable receipts and reconciliation → sender.</text><rect x="54" y="812" width="674" height="112" rx="8" fill="#fff" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="841" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Ticket/payment supplier</text><text x="72" y="881.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Application adapter for issuance and reconciliation. Supplier</text><text x="72" y="907.4" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">capability and integration effort must fit the pilot.</text><rect x="750" y="812" width="696" height="112" rx="8" fill="#eee6f8" stroke="#cbd7e3" stroke-width="1.5"/><text x="768" y="841" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Separate experiments</text><text x="768" y="881.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Read-only assistant adapter; one evaluated provider. Two camera</text><text x="768" y="907.4" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">positions. Neither experiment is an operational dependency.</text><text x="54" y="967" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20314d" font-weight="700">THREE INDEPENDENT CONTINUATION DECISIONS</text><rect x="54" y="991" width="450" height="207" rx="8" fill="#fff0d5" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Foundation · €28,440</text><text x="72" y="1060.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Gate: recovery, capture completeness and</text><text x="72" y="1086.3999999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">staff workload.</text><text x="72" y="1112.2399999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Pass: continue useful operations.</text><text x="72" y="1138.0799999999997" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Stop: fix acquisition/support.</text><rect x="525" y="991" width="450" height="207" rx="8" fill="#fff0d5" stroke="#cbd7e3" stroke-width="1.5"/><text x="543" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Visitor assistant · €6,240</text><text x="543" y="1060.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Gate: value versus search; policy and</text><text x="543" y="1086.3999999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">cost checks.</text><text x="543" y="1112.2399999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Pass: separate public release gate.</text><text x="543" y="1138.0799999999997" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Stop: approved search remains.</text><rect x="996" y="991" width="450" height="207" rx="8" fill="#fff0d5" stroke="#cbd7e3" stroke-width="1.5"/><text x="1014" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Camera feasibility · €3,120</text><text x="1014" y="1060.56" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Gate: useful observations, error and</text><text x="1014" y="1086.3999999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">review workload.</text><text x="1014" y="1112.2399999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Pass: separate camera adoption.</text><text x="1014" y="1138.0799999999997" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#20314d">Stop: keeper records remain.</text><rect x="54" y="1222" width="1392" height="144" rx="8" fill="#dff1eb" stroke="#cbd7e3" stroke-width="1.5"/><text x="72" y="1251" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d" font-weight="700">Estate expansion requires a separate decision</text><text x="72" y="1291.56" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d">Scale only capabilities that pass their own gates, with a finance-reviewed contribution case, physical capacity and</text><text x="72" y="1320.12" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20314d">sustainable staffing/support. A camera pass does not authorize estate expansion.</text><path d="M54 1426 L1446 1426" fill="none" stroke="#cbd7e3" stroke-width="2"/><text x="54" y="1452" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536780">Planning estimates: €37,800 pilot included in €463,380 staged program. Public assistant release is provisionally months 9–12, after evaluation.</text></svg></main></body></html>
